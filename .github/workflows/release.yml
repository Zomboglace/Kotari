# Publie une release quand on pousse un tag vX.Y.Z :
#   installateur Windows + latest.yml (mise à jour automatique), paquet kotari-server, script d'installation.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Vérifier que le tag correspond à la version
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version v$v de package.json" }

      - name: Installateur Windows
        run: npx electron-vite build && npx electron-builder --win nsis --publish never

      - name: Paquet serveur
        shell: pwsh
        run: |
          node scripts/build-server.mjs
          Compress-Archive -Path dist-server/kotari-server -DestinationPath kotari-server.zip -Force

      - name: Publier la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @('release/Kotari-Setup.exe', 'release/Kotari-Setup.exe.blockmap', 'release/latest.yml', 'kotari-server.zip', 'deploy/install-serveur.sh')
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Kotari $($tag.Substring(1))" --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Output "Fichiers de la release :"
          gh release view $tag --json assets --jq '.assets[].name'
