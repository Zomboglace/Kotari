appId: fr.kotari.app
productName: Kotari
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Kotari
  artifactName: Kotari-Setup-${version}.exe
publish: null
